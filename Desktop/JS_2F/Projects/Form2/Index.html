<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="th.jpg">
    </head>
    <body>
        <header>
            <h1>Application Form</h1>
            <br>
            <form>
                <label for="name" class="Labels">Name: </label>
                <input type="text" id="name" placeholder="Enter your name " required class="inputs">
                <br><br>
                <label for="employeeid" class="Labels">ID No.: </label>
                <input type="text" class="inputs" id="employeeid" placeholder="Enter Employee Id">
                <br><br>
                <label for="dob" class="Labels">DOB: </label>
                <input type="date" id="dob" class="inputs">
                <br><br>
                <label for="email" class="Labels">Email: </label>
                <input type="email" id="email" placeholder="Enter Email Id" required class="inputs">
                <br><br>
                <label for="pass" class="Labels">Password: </label>
                <input type="password" id="pass" class="inputs" required placeholder="Enter the Password">
                <br><br>
                <label for="age" class="Labels">Age: </label>
                <input type="number" id="age" class="inputs" placeholder="Enter your age">
                <br><br>
                <label for="gender" class="Labels">Gender: </label>
                <input type="radio" class="inputs" id="male" name="gender">
                <label for="male" class="Labels">Male</label>
                <input type="radio" class="inputs" id="female" name="gender">
                <label for="female" class="Labels">Female </label>
                <br><br>
                <label for="country" class="Labels">Country: </label>
                <select id="country" class="inputs">
                    <option value="Africa">Africa</option>
                    <option value="Bangladesh">Bangladesh</option>
                    <option value="Canada">Canada</option>
                    <option value="India">India</option>
                    <option value="USA">USA</option>
                    <option value="Vietnam">Vietnam</option>
                </select>
                <br><br>
                <textarea style="margin: 10px;" class="inputs" placeholder="Write your Project Description." rows="4" cols="40"></textarea>
                <br><br>
                <label class="Labels" id="file">Photo: </label>
                <input type="file" class="inputs" required id="file">
                <br><br>
                <input style="margin: 10px;" type="checkbox" name="" id="check" class="inputs" required>
                <label for="check" style="font-size: x-large; color:white;" >I am agree with the terms and conditions.</label>
                <br><br><br>
                <div>
                    <input type="submit" class="inputs" style="margin: 10px" >
                    <input type="reset" class="inputs" style="margin: 20px">
                </div>
            </form>
        </header>
        <footer>
            <h4>&copy; Vikas Sharma 2024</h4>
        </footer>        
    </body>
</html>
