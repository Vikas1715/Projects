<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <div id="box1">
            <div id="lw">
                <h2>Log in Window</h2>
            </div id="cb">
            <div id="box2">
                <div id="name">
                    <label for="namein"><h3>Username: </h3></label>
                    <input id="namein" type="text" class="inputs" placeholder="user@example.in ">
                </div>
                <div id="pass">
                    <label for="passin" ><h3>Password: </h3></label>
                    <input type="password" class="inputs" id="passin" placeholder="#example@123& ">
                </div>
            </div>
            <div id="submit">
                <button id="btn"><h3>Log in</h3></button>
            </div>
            <div class="l">
                <div id="l1">
                    <h4>Forgot Password</h4>
                </div>
            </div>
            <div class="l">
                <div id="l2">
                    <h4>Create Account</h4>
                </div>
            </div>
            <div class="l">
                <div id="copy">
                    <h5>&copy;Vikas Sharma 2024</h5>
                </div>
            </div>
            </div>            
        </div>
    </div>
        
</body>
</html>
